<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — A Literary Travel Series | Entangled Publishing</title>

<!--
  ============================================================
  HOW TO ADD OR UPDATE STORES (read this first!)
  ============================================================
  This page pulls all its content from a Google Sheet. You never
  touch this file to add a bookstore — you just edit the sheet.

  1. Make a Google Sheet with these exact column headers in row 1:
     continent | country | region | store_name | address | blurb | lat | lng | episode_url

     - continent    e.g. "North America", "Europe", "Asia"
     - country      e.g. "United States", "France"
     - region       the US state if the store is in the US
                    (e.g. "Tennessee"), otherwise the city
                    (e.g. "Paris")
     - store_name   the bookstore's name
     - address      full street address, shown in the popup
     - blurb        1–2 sentence description
     - lat / lng    the store's coordinates. Easiest way: right-click
                    the location in Google Maps and click the
                    coordinates to copy them (lat first, then lng)
     - episode_url  link to the IG/TikTok episode for that stop

  2. File > Share > Publish to web > choose the sheet tab >
     choose "Comma-separated values (.csv)" > Publish.
     Copy the link it gives you.

  3. Paste that link into SHEET_CSV_URL below, between the quotes.

  That's it. Add a new row to the sheet, refresh the page, the new
  dot appears on the map and in the browse list automatically.
  ============================================================
-->

<style>
  :root{
    --hot-pink: #ff2f7e;
    --hot-pink-dark: #e0166a;
    --light-pink: #ffd9e8;
    --pale-pink: #fff2f7;
    --white: #ffffff;
    --black: #14100f;
    --font: Arial, Helvetica, "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--white);
    color: var(--black);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  /* ---------- Header ---------- */
  header{
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 3px solid var(--black);
  }
  .eyebrow{
    display:inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--hot-pink-dark);
    margin-bottom: 8px;
  }
  h1{
    margin: 0;
    font-size: clamp(32px, 7vw, 56px);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  h1 span{ color: var(--hot-pink); }
  .subhead{
    margin: 10px auto 0;
    max-width: 520px;
    font-size: 15px;
    color: #4a4340;
  }

  /* ---------- Map section ---------- */
  .map-wrap{
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 8px;
  }
  .map-hint{
    text-align:center;
    font-size: 13px;
    color:#7a716d;
    margin-bottom: 10px;
  }
  .map-frame{
    position: relative;
    background: var(--pale-pink);
    border: 3px solid var(--black);
    border-radius: 18px;
    overflow: hidden;
  }
  svg#worldmap{
    display:block;
    width: 100%;
    height: auto;
    touch-action: none;
  }
  .land{
    fill: var(--light-pink);
    stroke: var(--black);
    stroke-width: 0.6px;
    vector-effect: non-scaling-stroke;
  }
  .zoom-controls{
    position: absolute;
    right: 12px; bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zoom-controls button{
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--black);
    background: var(--white);
    color: var(--black);
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
  }
  .zoom-controls button:hover{ background: var(--light-pink); }
  .zoom-controls #zoomReset{ font-size: 15px; }
  .dot{
    fill: var(--hot-pink);
    stroke: var(--white);
    stroke-width: 1.6px;
    vector-effect: non-scaling-stroke;
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.15s ease, fill 0.15s ease;
  }
  .dot:hover, .dot:focus, .dot.active{
    fill: var(--black);
    transform: scale(1.6);
    outline: none;
  }
  .dot-pulse{
    fill: var(--hot-pink);
    opacity: 0.35;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference){
    .dot-pulse{ animation: pulse 2.2s ease-out infinite; }
  }
  @keyframes pulse{
    0%   { r: 6;  opacity: 0.35; }
    100% { r: 16; opacity: 0; }
  }

  .loading-msg{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 14px; color:#7a716d;
    background: var(--pale-pink);
  }

  /* ---------- Store card (bookmark-tail popup) ---------- */
  .card-backdrop{
    position: fixed; inset: 0;
    background: rgba(20,16,15,0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 40;
  }
  .card-backdrop.show{ opacity: 1; pointer-events: auto; }

  .store-card{
    position: fixed;
    left: 50%; bottom: 0;
    transform: translate(-50%, 100%);
    width: min(92vw, 420px);
    background: var(--white);
    border: 3px solid var(--black);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 22px 22px 26px;
    z-index: 41;
    transition: transform 0.25s ease;
    max-height: 78vh;
    overflow-y: auto;
  }
  .store-card.show{ transform: translate(-50%, 0); }

  .ribbon-tab{
    display:inline-block;
    background: var(--hot-pink);
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px 9px;
    margin: -22px 0 14px -4px;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
  }
  .store-card h2{
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
  }
  .store-card .addr{
    font-size: 13px;
    color: #7a716d;
    margin-bottom: 12px;
  }
  .store-card .blurb{
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .store-card .episode-btn{
    display:inline-block;
    background: var(--black);
    color: var(--white);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .store-card .episode-btn:hover{ background: var(--hot-pink-dark); }

  .card-close{
    position: absolute;
    top: 14px; right: 16px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid var(--black);
    background: var(--white);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  /* ---------- Browse / filter drawer ---------- */
  .browse{
    max-width: 720px;
    margin: 30px auto 60px;
    padding: 0 20px;
  }
  .browse h3{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--hot-pink-dark);
    margin: 0 0 12px;
  }
  details{
    border-bottom: 1px solid #e8dfe3;
  }
  details > summary{
    list-style: none;
    cursor: pointer;
    padding: 14px 4px;
    font-weight: 700;
    display:flex;
    align-items:center;
    justify-content: space-between;
    font-size: 16px;
  }
  details > summary::-webkit-details-marker{ display:none; }
  summary::after{
    content: "+";
    color: var(--hot-pink);
    font-size: 20px;
    font-weight: 800;
  }
  details[open] > summary::after{ content: "–"; }

  details details{ border-bottom: none; padding-left: 14px; }
  details details > summary{ font-size: 14px; font-weight: 600; }
  details details details{ padding-left: 14px; }
  details details details > summary{ font-size: 13px; font-weight: 600; color:#4a4340; }

  .store-btn{
    display:block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 10px;
    margin: 2px 0;
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
  }
  .store-btn:hover, .store-btn:focus{
    background: var(--light-pink);
    outline: none;
  }

  footer{
    text-align:center;
    font-size: 12px;
    color:#9a908c;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Entangled Publishing</span>
  <h1>Book<span>marks</span></h1>
  <p class="subhead">A Literary Travel Series</p>
</header>

<div class="browse">
  <h3>Browse by location</h3>
  <div id="browseList"><!-- built from sheet data --></div>
</div>

<div class="map-wrap">
  <p class="map-hint">Tap a pink dot to open that stop</p>
  <div class="map-frame">
    <svg id="worldmap" viewBox="0 0 960 500" role="img" aria-label="World map of Bookmarks store locations"></svg>
    <div class="loading-msg" id="loadingMsg">Loading the map…</div>
    <div class="zoom-controls">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">–</button>
      <button id="zoomReset" aria-label="Reset zoom">⟲</button>
    </div>
  </div>
</div>

<footer>Bookmarks · A Literary Travel Series · Entangled Publishing</footer>

<div class="card-backdrop" id="backdrop"></div>
<div class="store-card" id="storeCard" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <button class="card-close" id="cardClose" aria-label="Close">✕</button>
  <span class="ribbon-tab">Bookmarks Stop</span>
  <h2 id="cardTitle"></h2>
  <p class="addr" id="cardAddr"></p>
  <p class="blurb" id="cardBlurb"></p>
  <a class="episode-btn" id="cardLink" href="#" target="_blank" rel="noopener">Watch the episode →</a>
</div>

<!-- ============ EDIT THIS LINE ONLY ============ -->
<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1oK668FnnnrO10PXkJ0jvigclte767eR3GWEn11ZE1i0/gviz/tq?tqx=out:csv&gid=0";
</script>
<!-- ============================================== -->

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>
(async function(){

  const width = 960, height = 500;
  const svg = d3.select("#worldmap");
  const projection = d3.geoNaturalEarth1().fitSize([width - 20, height - 20], {type:"Sphere"});
  projection.translate([width/2, height/2 + 8]);
  const path = d3.geoPath(projection);

  const mapRoot = svg.append("g").attr("id","mapRoot");   // land only — this one scales
  const markers = svg.append("g").attr("id","markers");    // pins — fixed size, repositioned manually

  // Zoom / pan behavior — lets close-together pins (like NYC) spread apart.
  // Only the land scales with the transform; pin markers are repositioned
  // (not resized) each time, so they never balloon into giant blobs.
  const zoom = d3.zoom()
    .scaleExtent([1, 60])
    .translateExtent([[0,0],[width,height]])
    .on("zoom", (event) => {
      mapRoot.attr("transform", event.transform);
      markerRefs.forEach(ref => {
        const x = event.transform.applyX(ref.d._x);
        const y = event.transform.applyY(ref.d._y);
        ref.pulse.setAttribute("cx", x); ref.pulse.setAttribute("cy", y);
        ref.dot.setAttribute("cx", x); ref.dot.setAttribute("cy", y);
      });
    });
  svg.call(zoom);
  const markerRefs = []; // filled in once rows are plotted below

  document.getElementById("zoomIn").addEventListener("click", () => {
    svg.transition().duration(200).call(zoom.scaleBy, 1.6);
  });
  document.getElementById("zoomOut").addEventListener("click", () => {
    svg.transition().duration(200).call(zoom.scaleBy, 0.625);
  });
  document.getElementById("zoomReset").addEventListener("click", () => {
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
  });

  // 1. Draw base world map (from a public topojson CDN)
  try {
    const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    const countries = topojson.feature(world, world.objects.countries);
    mapRoot.append("g")
      .selectAll("path")
      .data(countries.features)
      .join("path")
      .attr("class","land")
      .attr("d", path);
  } catch (err) {
    console.error("Could not load base map", err);
    document.getElementById("loadingMsg").textContent =
      "Map couldn't load — this page needs to be opened from a real web address (not a local file). See hosting note below.";
    return;
  }

  document.getElementById("loadingMsg").textContent = "Loading store locations…";

  // 2. Load store data from the published Google Sheet CSV
  let rows = [];
  if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("PASTE_YOUR") === 0) {
    document.getElementById("loadingMsg").textContent =
      "Add your Google Sheet CSV link in the code (SHEET_CSV_URL) to load stores.";
  } else {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      rows = parsed.data
        .map(r => ({
          continent: (r.continent||"").trim(),
          country:   (r.country||"").trim(),
          region:    (r.region||"").trim(),
          store_name:(r.store_name||"").trim(),
          address:   (r.address||"").trim(),
          blurb:     (r.blurb||"").trim(),
          lat: parseFloat(r.lat),
          lng: parseFloat(r.lng),
          episode_url: (r.episode_url||"").trim()
        }))
        .filter(r => r.store_name && !isNaN(r.lat) && !isNaN(r.lng));
      document.getElementById("loadingMsg").style.display = "none";
    } catch (err) {
      console.error(err);
      document.getElementById("loadingMsg").textContent = "Couldn't load the sheet — check the CSV link.";
    }
  }

  // 3. Plot dots
  function flyTo(d){
    const targetScale = 25;
    const t = d3.zoomIdentity
      .translate(width/2, height/2)
      .scale(targetScale)
      .translate(-d._x, -d._y);
    svg.transition().duration(500).call(zoom.transform, t);
  }

  // Project every row first, then nudge apart any pins that would otherwise
  // land almost exactly on top of each other (e.g. two stores a block apart) —
  // this is a stylized map, not street-level, so raw coordinates alone can't
  // always separate visually. Real zoom (below) handles neighborhood-scale gaps.
  rows.forEach((d, i) => {
    const p = projection([d.lng, d.lat]);
    if (p) { d._x = p[0]; d._y = p[1]; }
    d._id = "store-" + i;
  });
  const plotted = rows.filter(d => d._x !== undefined);
  const CLUSTER_DIST = 1.4;
  const used = new Array(plotted.length).fill(false);
  plotted.forEach((d, i) => {
    if (used[i]) return;
    const group = [i];
    for (let j = i + 1; j < plotted.length; j++) {
      if (used[j]) continue;
      const dx = plotted[j]._x - d._x, dy = plotted[j]._y - d._y;
      if (Math.sqrt(dx*dx + dy*dy) < CLUSTER_DIST) group.push(j);
    }
    if (group.length > 1) {
      const cx = d._x, cy = d._y;
      const radius = 2.6;
      group.forEach((idx, k) => {
        used[idx] = true;
        const angle = (k / group.length) * 2 * Math.PI;
        plotted[idx]._x = cx + radius * Math.cos(angle);
        plotted[idx]._y = cy + radius * Math.sin(angle);
      });
    } else {
      used[i] = true;
    }
  });

  plotted.forEach((d) => {
    const pulse = markers.append("circle")
      .attr("class","dot-pulse")
      .attr("cx", d._x).attr("cy", d._y).attr("r", 6)
      .node();

    const dot = markers.append("circle")
      .attr("class","dot")
      .attr("id", d._id)
      .attr("cx", d._x).attr("cy", d._y).attr("r", 6)
      .attr("tabindex", 0)
      .attr("role","button")
      .attr("aria-label", d.store_name)
      .on("click", () => { flyTo(d); openCard(d); })
      .on("keydown", (event) => { if (event.key === "Enter") { flyTo(d); openCard(d); } })
      .node();

    markerRefs.push({ d, pulse, dot });
  });

  // 4. Store card open/close
  const card = document.getElementById("storeCard");
  const backdrop = document.getElementById("backdrop");

  function openCard(d){
    document.getElementById("cardTitle").textContent = d.store_name;
    document.getElementById("cardAddr").textContent = d.address;
    document.getElementById("cardBlurb").textContent = d.blurb;
    const link = document.getElementById("cardLink");
    if (d.episode_url) { link.href = d.episode_url; link.style.display = "inline-block"; }
    else { link.style.display = "none"; }

    document.querySelectorAll(".dot.active").forEach(el => el.classList.remove("active"));
    const dotEl = document.getElementById(d._id);
    if (dotEl) dotEl.classList.add("active");

    card.classList.add("show");
    backdrop.classList.add("show");
  }
  function closeCard(){
    card.classList.remove("show");
    backdrop.classList.remove("show");
    document.querySelectorAll(".dot.active").forEach(el => el.classList.remove("active"));
  }
  document.getElementById("cardClose").addEventListener("click", closeCard);
  backdrop.addEventListener("click", closeCard);

  // 5. Build the Continent > Country > Region > Store browse drawer
  const browseList = document.getElementById("browseList");
  const tree = {};
  rows.forEach(d => {
    tree[d.continent] = tree[d.continent] || {};
    tree[d.continent][d.country] = tree[d.continent][d.country] || {};
    tree[d.continent][d.country][d.region] = tree[d.continent][d.country][d.region] || [];
    tree[d.continent][d.country][d.region].push(d);
  });

  Object.keys(tree).sort().forEach(continent => {
    const continentDetails = document.createElement("details");
    const continentSummary = document.createElement("summary");
    continentSummary.textContent = continent;
    continentDetails.appendChild(continentSummary);

    Object.keys(tree[continent]).sort().forEach(country => {
      const countryDetails = document.createElement("details");
      const countrySummary = document.createElement("summary");
      countrySummary.textContent = country;
      countryDetails.appendChild(countrySummary);

      Object.keys(tree[continent][country]).sort().forEach(region => {
        const regionDetails = document.createElement("details");
        const regionSummary = document.createElement("summary");
        regionSummary.textContent = region;
        regionDetails.appendChild(regionSummary);

        tree[continent][country][region].forEach(store => {
          const btn = document.createElement("button");
          btn.className = "store-btn";
          btn.textContent = "📍 " + store.store_name;
          btn.addEventListener("click", () => {
            flyTo(store);
            openCard(store);
            document.querySelector(".map-frame").scrollIntoView({ behavior: "smooth", block: "center" });
          });
          regionDetails.appendChild(btn);
        });

        countryDetails.appendChild(regionDetails);
      });

      continentDetails.appendChild(countryDetails);
    });

    browseList.appendChild(continentDetails);
  });

  if (rows.length === 0) {
    browseList.innerHTML = '<p style="font-size:14px;color:#9a908c;">No stores loaded yet.</p>';
  }

})();
</script>

</body>
</html>
